[project]
name = "tahgul"
version = "0.1.0"
description = "Self-hosted ops app for a solo consultancy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "httpx>=0.27",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "cryptography>=43",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
    "weasyprint>=62",
    "mutagen>=1.47",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "radicale>=3.2",
]

[project.scripts]
tahgul = "tahgul.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tahgul*"]

[tool.setuptools.package-data]
tahgul = ["static/**/*", "templates/*"]
