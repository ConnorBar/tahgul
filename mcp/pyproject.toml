[project]
name = "tahgul-mcp"
version = "0.1.0"
description = "MCP server exposing Tahgul's REST API as tools for a local agent"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
tahgul-mcp = "tahgul_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tahgul_mcp*"]
