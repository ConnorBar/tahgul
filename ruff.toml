line-length = 100
target-version = "py312"
extend-exclude = ["api/migrations/versions"]

[lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's Depends() in defaults is the intended pattern.
ignore = ["B008"]

[lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[lint.isort]
known-first-party = ["tahgul", "conftest"]
