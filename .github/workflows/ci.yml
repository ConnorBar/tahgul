name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tahgul
          POSTGRES_PASSWORD: tahgul
          POSTGRES_DB: tahgul_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tahgul" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      TAHGUL_TEST_DATABASE_URL: postgresql+psycopg://tahgul:tahgul@localhost:5432/tahgul_test
      TAHGUL_DATABASE_URL: postgresql+psycopg://tahgul:tahgul@localhost:5432/tahgul_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            mcp/pyproject.toml
      - name: PDF libraries (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pip install -e "api[dev]" -e mcp
      - name: Lint
        run: |
          ruff check api tests mcp
          ruff format --check api tests mcp
          shellcheck deploy/*.sh deploy/hive/*.sh
      - name: Migrations apply cleanly and match the models
        working-directory: api
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke-test the stack
        env:
          POSTGRES_PASSWORD: ci-password
          TAHGUL_SECRET_KEY: ci-secret-key-long-enough-for-fernet
          RADICALE_USER: ci
          RADICALE_PASSWORD: ci-calendar-password
          TAHGUL_COOKIE_SECURE: "false"
          TAHGUL_OWNER_EMAIL: ci@example.com
          TAHGUL_OWNER_PASSWORD: ci-password-long
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build --wait
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:8000/api/docs | grep -q swagger
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fsS -c jar -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-long"}'
          curl -fsS -b jar http://127.0.0.1:8000/api/v1/workspaces | grep -q Consulting
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Browser smoke tests on demo data
        env:
          POSTGRES_PASSWORD: ci-password
          TAHGUL_SECRET_KEY: ci-secret-key-long-enough-for-fernet
          RADICALE_USER: ci
          RADICALE_PASSWORD: ci-calendar-password
          TAHGUL_SMOKE_URL: http://127.0.0.1:8000
          TAHGUL_SMOKE_EMAIL: ci@example.com
          TAHGUL_SMOKE_PASSWORD: ci-password-long
        run: |
          docker compose -f deploy/docker-compose.yml exec -T api tahgul seed-demo
          pip install -e "api[dev]" playwright
          python -m playwright install --with-deps chromium
          pytest tests/smoke -p no:warnings
      - name: Public reports container serves reports only
        env:
          POSTGRES_PASSWORD: ci-password
          TAHGUL_SECRET_KEY: ci-secret-key-long-enough-for-fernet
          RADICALE_USER: ci
          RADICALE_PASSWORD: ci-calendar-password
        run: |
          docker compose -f deploy/docker-compose.yml --profile public-reports up -d --build --wait reports
          docker compose -f deploy/docker-compose.yml exec -T reports python -c "
          import urllib.request as u, urllib.error as e
          assert u.urlopen('http://127.0.0.1:8001/healthz').read() == b'ok'
          for p in ['/', '/api/v1/health', '/api/docs', '/r/not-a-token']:
              try:
                  u.urlopen('http://127.0.0.1:8001' + p)
                  raise SystemExit(p + ' should be 404')
              except e.HTTPError as x:
                  assert x.code == 404, (p, x.code)
          print('reports container ok')"
      - name: Backup, change, restore
        env:
          POSTGRES_PASSWORD: ci-password
          TAHGUL_SECRET_KEY: ci-secret-key-long-enough-for-fernet
          RADICALE_USER: ci
          RADICALE_PASSWORD: ci-calendar-password
          TAHGUL_COOKIE_SECURE: "false"
        run: |
          count() { docker compose -f deploy/docker-compose.yml exec -T db psql -U tahgul -d tahgul -tAc "$1"; }
          BACKUP_DIR=$PWD/ci-backups deploy/backup.sh
          before=$(count "select count(*) from time_entries")
          count "delete from voice_notes; update time_entries set deleted_at = now()"
          YES=1 deploy/restore.sh ci-backups/20*
          after=$(count "select count(*) from time_entries where deleted_at is null")
          echo "entries before=$before after=$after"
          test "$before" = "$after"
          curl -fsS http://127.0.0.1:8000/api/v1/health
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
