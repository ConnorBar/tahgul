# Tahgul stack.
#
#   cp deploy/.env.example deploy/.env    # then edit it
#   docker compose -f deploy/docker-compose.yml up --build
#
# Development: the API is published on 127.0.0.1:8000 only (never the LAN).
# Homelab: also start the Tailscale sidecar with `--profile tailscale`; it serves
# https://tahgul.<tailnet>.ts.net (the app) and https://tahgul.<tailnet>.ts.net:8443
# (Radicale, for the iPhone's Calendar app) and is the only way in from other devices.

name: tahgul

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tahgul
      POSTGRES_USER: tahgul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tahgul -d tahgul"]
      interval: 5s
      timeout: 3s
      retries: 20

  radicale:
    build: ./radicale
    restart: unless-stopped
    environment:
      RADICALE_USER: ${RADICALE_USER:?set RADICALE_USER in deploy/.env}
      RADICALE_PASSWORD: ${RADICALE_PASSWORD:?set RADICALE_PASSWORD in deploy/.env}
    volumes:
      - radicale-data:/data

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      radicale:
        condition: service_started
    environment:
      TAHGUL_DATABASE_URL: postgresql+psycopg://tahgul:${POSTGRES_PASSWORD}@db:5432/tahgul
      TAHGUL_SECRET_KEY: ${TAHGUL_SECRET_KEY:?set TAHGUL_SECRET_KEY in deploy/.env}
      # Tahgul talks to Radicale inside the stack; your phone uses Tailscale (port 8443).
      TAHGUL_RADICALE_URL: http://radicale:5232/
      TAHGUL_RADICALE_USER: ${RADICALE_USER}
      TAHGUL_RADICALE_PASSWORD: ${RADICALE_PASSWORD}
      # Transcription: start the stack with --profile whisper and set this to
      # http://whisper:8000 in deploy/.env (or point it at any OpenAI-compatible server).
      TAHGUL_PUBLIC_REPORT_URL: ${TAHGUL_PUBLIC_REPORT_URL:-}
      TAHGUL_WHISPER_URL: ${TAHGUL_WHISPER_URL:-}
      TAHGUL_WHISPER_MODEL: ${TAHGUL_WHISPER_MODEL:-Systran/faster-whisper-small}
      TAHGUL_WHISPER_LANGUAGE: ${TAHGUL_WHISPER_LANGUAGE:-}
      # Plain HTTP on localhost during development; true behind Tailscale HTTPS.
      TAHGUL_COOKIE_SECURE: ${TAHGUL_COOKIE_SECURE:-true}
      TAHGUL_OWNER_EMAIL: ${TAHGUL_OWNER_EMAIL:-}
      TAHGUL_OWNER_PASSWORD: ${TAHGUL_OWNER_PASSWORD:-}
    ports:
      - "127.0.0.1:${TAHGUL_PORT:-8000}:8000"
    volumes:
      # Invoice PDFs and voice notes. Back this up along with the database.
      - tahgul-data:/data

  # Client report links for the public internet: a separate tiny app that serves
  # /r/<token> pages and nothing else (no login, no API). Only started with
  #   docker compose --profile public-reports up -d
  reports:
    profiles: ["public-reports"]
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: []
    command: ["uvicorn", "tahgul.public:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      TAHGUL_DATABASE_URL: postgresql+psycopg://tahgul:${POSTGRES_PASSWORD}@db:5432/tahgul
      TAHGUL_SCHEDULER_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 30s
      timeout: 5s

  # Local speech-to-text (faster-whisper behind an OpenAI-compatible API). Optional:
  #   docker compose --profile whisper up -d
  # The first transcription downloads the model (~500 MB for "small") into whisper-models.
  whisper:
    profiles: ["whisper"]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub

  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:stable
    hostname: tahgul
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ts-state:/var/lib/tailscale
      # serve-public-reports.json also opens client report links (only) to the internet
      # on port 10000 with Tailscale Funnel. See docs/client-reports.md.
      - ./tailscale/${TS_SERVE_FILE:-serve.json}:/config/serve.json:ro
    depends_on:
      - api
      - radicale

volumes:
  db-data:
  radicale-data:
  whisper-models:
  tahgul-data:
  ts-state:
