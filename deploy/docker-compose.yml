# Ledger stack.
#
#   cp deploy/.env.example deploy/.env    # then edit it
#   docker compose -f deploy/docker-compose.yml up --build
#
# Development: the API is published on 127.0.0.1:8000 only (never the LAN).
# Homelab: also start the Tailscale sidecar with `--profile tailscale`; it serves
# https://ledger.<tailnet>.ts.net and is the only way in from other devices.

name: ledger

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LEDGER_DATABASE_URL: postgresql+psycopg://ledger:${POSTGRES_PASSWORD}@db:5432/ledger
      # Plain HTTP on localhost during development; true behind Tailscale HTTPS.
      LEDGER_COOKIE_SECURE: ${LEDGER_COOKIE_SECURE:-true}
      LEDGER_OWNER_EMAIL: ${LEDGER_OWNER_EMAIL:-}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:-}
    ports:
      - "127.0.0.1:${LEDGER_PORT:-8000}:8000"

  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:stable
    hostname: ledger
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - api

volumes:
  db-data:
  ts-state:
